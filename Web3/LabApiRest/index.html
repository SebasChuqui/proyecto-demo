<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>álbumes por usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4f4;
            margin: 0;
            padding: 30px;
            color: #34495e;
        }

        h1 {
            text-align: center;
            color: #5b7c99;
            background-color: #d6eaf8;
            padding: 20px;
            border-radius: 15px;
        }

        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input {
            padding: 9px;
            border: 2px solid #c5dedd;
            border-radius: 8px;
            margin: 5px;
            outline: none;
        }

        input:focus {
            border-color: #8ecfd1;
        }

        button {
            background-color: #a8dadc;
            color: #34495e;
            border: none;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #8ecfd1;
        }

        ol {
            background-color: #ffffff;
            padding: 25px 45px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #e8eeee;
        }

        li:last-child {
            border-bottom: none;
        }

        .contenedor {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .ejercicio {
            width: 50%;
        }

        .ejercicio h2 {
            text-align: center;
            color: #668ba4;
            background-color: #d6eaf8;
            padding: 15px;
            border-radius: 12px;
        }

        .comentarios {
            background-color: #ffffff;
            padding: 20px 35px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .comentarios li {
            padding: 12px;
            margin-bottom: 8px;
            border-bottom: 1px solid #e5eeee;
        }

        @media (max-width: 700px) {
            .contenedor {
                flex-direction: column;
            }

            .ejercicio {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <script src="js/script.js"></script>
    <div class="contenedor">
        <div class="ejercicio">
            <h2>albums por usuario</h2>
            <form onsubmit="BuscarAlbumUsuario(); return false;">
                <label for="idUsuario">id de usuario:</label>
                <input type="number" id="idUsuario" min="1" max="10" required>
                <button type="submit">buscar album</button>
            </form>
            <ol id="ListaAlbum"></ol>
        </div>
        <div class="ejercicio">
            <h2>comentarios de un post</h2>
            <form onsubmit="BuscarComentariosPost(); return false;">
                <label for="idPost">id del post:</label>
                <input type="number" id="idPost" min="1" max="100" required>
                <button type="submit">mostrar comentarios</button>
            </form>
            <ol id="ListaComentarios" class="comentarios"></ol>
        </div>
    </div>
</body>
</html>
