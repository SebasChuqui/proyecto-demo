<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebastian Chuquimia</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #eaf4f4;
    margin: 0;
    padding: 30px;
    color: #34495e;
}

h1 {
    text-align: center;
    color: #5b7c99;
    background-color: #d6eaf8;
    padding: 20px;
    border-radius: 15px;
}

h2 {
    color: #668ba4;
    margin-top: 30px;
}

form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 15px;
    margin: 15px 0;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

button {
    background-color: #a8dadc;
    color: #34495e;
    border: none;
    padding: 10px 18px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background-color: #8ecfd1;
}

input {
    padding: 9px;
    border: 2px solid #c5dedd;
    border-radius: 8px;
    margin: 5px;
    outline: none;
}

input:focus {
    border-color: #8ecfd1;
}

ol {
    background-color: #ffffff;
    padding: 25px 45px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

li {
    padding: 8px;
    border-bottom: 1px solid #e8eeee;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    margin-top: 15px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}

th {
    background-color: #b8d8e3;
    color: #34495e;
    padding: 12px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #e5eeee;
}

tr:hover {
    background-color: #f0f8f8;
}

p {
    background-color: #ffffff;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.6;
}
    </style>
</head>

<body>
    <h1>DATOS DE JSON PLACE HOLDER</h1>
    <h2>Lista de Usuarios</h2>

    <ol id="listausuarios">
    </ol>

    <form action="">
        <button type="button" onclick="mostrarTabla()">mostrar tabla Usuarios</button>
        <button type="button" onclick="limpiarTabla()">limpiar tabla</button>
        <button type="button" onclick="mostrarDatosTabla()">mostrar datos</button>
    </form>

    <table border="2">
        <thead>
            <td>Nombre</td>
            <td>Usuarios</td>
        </thead>
        <tbody id="datosTabla">

        </tbody>
    </table>
    <h2>Datos de Usuarios</h2>
    <form action="" name="form2">
        <label for="idUsuario">id usuario</label>
        <input type="number" id="idUsuario" name="idUsuario" min="1" max="10">
        <button type="button" onclick="mostrarUsuario()">Mostrar Usuario</button>
    </form>

    <p id="datosUsuario"></p>

    <script src="js/script.js"></script>

    <h2>Listado de Posts</h2>

    <button type="button" onclick="mostrarPosts()">Mostrar Posts</button>

    <table border="2">
        <thead>
            <tr>
                <th>id</th>
                <th>title</th>
            </tr>
        </thead>
        <tbody id="datosPosts">
        </tbody>
    </table>


    <h2>Buscar Post por ID</h2>

    <form action="">
        <label for="idPost">id del post</label>
        <input type="number" id="idPost" min="1" max="100">

        <button type="button" onclick="buscarPost()">Buscar</button>
    </form>

    <p id="datosPost"></p>

</body>

</html>
